<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Atlas de modelos mentales</title>
<style>
:root{--bg:#f5f3ee;--sf:#fff;--tx:#1b1d22;--mu:#666b75;--ln:#dcd8cf;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15171b;--sf:#1f2227;--tx:#eceae4;--mu:#9aa0aa;--ln:#343841;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15171b;--sf:#1f2227;--tx:#eceae4;--mu:#9aa0aa;--ln:#343841;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 "Segoe UI",system-ui,sans-serif}
header{padding:40px 20px 16px;max-width:1100px;margin:auto}
h1{font:800 clamp(34px,7vw,64px)/1 "Arial Black",Impact,sans-serif;margin:0 0 12px;letter-spacing:-.03em}
header p{max-width:60ch;color:var(--mu);margin:0}
.bar{max-width:1100px;margin:auto;padding:12px 20px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{border:2px solid var(--c,var(--ln));background:transparent;color:var(--tx);border-radius:99px;padding:6px 14px;font:inherit;font-size:14px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--c,var(--tx));color:#fff}
input{flex:1;min-width:160px;border:2px solid var(--ln);background:var(--sf);color:var(--tx);border-radius:10px;padding:8px 12px;font:inherit}
:focus-visible{outline:3px solid #3b6fe0;outline-offset:2px}
main{max-width:1100px;margin:auto;padding:8px 20px 60px;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.card{background:var(--sf);border:1px solid var(--ln);border-top:6px solid var(--c);border-radius:6px;padding:12px;text-align:left;color:var(--tx);font:inherit;cursor:pointer}
.card:hover{border-color:var(--c)}
.card h3{margin:6px 0 0;font-size:16px}.card small{color:var(--mu)}
svg{width:100%;height:auto;display:block}
dialog{border:0;border-radius:10px;background:var(--sf);color:var(--tx);width:min(720px,94vw);max-height:92vh;padding:22px}
dialog::backdrop{background:#000a}
dialog h2{margin:0 0 4px;font-size:28px}
.tag{font-size:14px;font-weight:600}
.box{background:var(--bg);border-left:5px solid var(--c);padding:10px 14px;margin-top:12px;border-radius:4px}
.x{float:right;font-size:22px;background:none;border:0;color:var(--tx);cursor:pointer}
.nav{display:flex;justify-content:space-between;margin-top:14px}
</style><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;600&family=Caveat:wght@600;700&display=swap">
<style>
body{font-family:"DM Sans",system-ui,sans-serif}
h1,h2,h3,.chip{font-family:"Bricolage Grotesque","Arial Black",sans-serif}
h1{font-weight:800;letter-spacing:-.045em;display:inline-block}
.sc{display:block;width:min(100%,540px);height:14px;margin-top:4px}
.sc path{fill:none;stroke:#e8554e;stroke-width:4;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:dr 1.2s .3s forwards}
.card{border:2px solid var(--tx);border-top-width:2px;box-shadow:5px 5px 0 var(--c);border-radius:14px;transition:transform .2s,box-shadow .2s}
.card:hover{transform:translate(-2px,-3px) rotate(-.6deg);box-shadow:8px 8px 0 var(--c)}
.tx{font-family:Caveat,"Segoe Print","Comic Sans MS",cursive;font-weight:700;fill:var(--tx)}
.sk,.rough{filter:url(#rough)}
@keyframes dr{to{stroke-dashoffset:0}}
@keyframes pop{from{opacity:0;transform:scale(.5) rotate(-6deg)}}
@keyframes gr{from{transform:scaleY(0)}}
@keyframes fl{to{stroke-dashoffset:-18}}
@keyframes wob{50%{transform:rotate(1.5deg) scale(1.04)}}
.sk>*{transform-box:fill-box;transform-origin:center}
dialog .sk>*{animation:pop .55s cubic-bezier(.3,1.6,.5,1) both;animation-delay:calc(var(--i,0)*.09s)}
.card:hover .sk>*{animation:wob .7s ease-in-out calc(var(--i,0)*.06s)}
.sk>.bg{transform-origin:bottom}
dialog .sk>.bg{animation:gr .8s cubic-bezier(.3,1.4,.5,1) both;animation-delay:calc(var(--i,0)*.1s)}
dialog .dr{stroke-dasharray:1;stroke-dashoffset:1;animation:dr 1.8s .2s forwards}
.fl{stroke-dasharray:5 4;animation:fl .8s linear infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.dr{stroke-dashoffset:0!important}}
</style>
</head><body>
<header><h1>Atlas de modelos mentales</h1>
<p>Marcos de pensamiento para decidir mejor, agrupados por tema. Filtra, busca y abre cualquier modelo para ver su esquema y cómo aplicarlo.</p></header>
<div class="bar" id="bar"></div>
<main id="grid"></main>
<dialog id="dlg"><button class="x" aria-label="Cerrar" onclick="dlg.close()">×</button><div id="dc"></div>
<div class="nav"><button class="chip" onclick="step(-1)">Anterior</button><button class="chip" onclick="step(1)">Siguiente</button></div></dialog>
<script>
const C={mente:['Mente','#e8554e'],ses:['Sesgos cognitivos','#a855c7'],ind:['Individuo','#16946f'],eq:['Equipo','#c98f00'],org:['Organización','#3b6fe0'],soc:['Sociedad','#d9701a'],dec:['Decisión y ejecución','#0e8fa8']};
// [cat, nombre, plantilla, etiquetas, descripción, cuándo usarlo]
const M=[
['mente','Principio de Pareto','bar',['1','2','3','4','5'],'Una minoría de causas (alrededor del 20 %) produce la mayoría de los efectos (alrededor del 80 %). Casi todo está desigualmente repartido.','Al priorizar: identifica las pocas tareas, clientes o errores que concentran el resultado.',[70,12,8,6,4]],
['mente','Método científico','flo',['Observar','Hipótesis','Experimento','Analizar','Conclusión'],'Un ciclo para reducir la incertidumbre: formulas una hipótesis que pueda refutarse, la pones a prueba y ajustas tus creencias con los datos.','Cuando dudes de una idea: diseña la prueba más barata que pueda demostrar que te equivocas.'],
['mente','Interés compuesto','cur',['Tiempo','Valor','exp'],'Las ganancias generan ganancias. El crecimiento parece lento al principio y se dispara al final, así que el tiempo pesa más que el esfuerzo inicial.','Para ahorro, hábitos y aprendizaje: empieza pronto y sé constante.'],
['mente','Rendimientos decrecientes','cur',['Esfuerzo','Resultado','dim'],'Cada unidad extra de esfuerzo aporta menos que la anterior. Pasado cierto punto, seguir invirtiendo casi no mejora el resultado.','Para decidir cuándo algo está «suficientemente bien» y pasar a otra cosa.'],
['mente','Pensamiento de segundo orden','flo',['Decisión','Efecto|inmediato','Efecto de|segundo orden','Efecto a|largo plazo'],'Preguntarte «¿y luego qué?» repetidamente. Las decisiones tienen consecuencias de las consecuencias, a menudo contrarias a la intención inicial.','Antes de decisiones con efectos a largo plazo: políticas, precios, contrataciones.'],
['mente','Coste de oportunidad','flo',['Eliges A','Renuncias|a B','Coste = valor|de B'],'El verdadero coste de algo es lo mejor a lo que renuncias para obtenerlo, no solo lo que pagas por ello.','Al comparar opciones: pregunta siempre «¿qué dejo de hacer con este tiempo o dinero?».'],
['mente','Ventana de Johari','mat',['Arena','Punto ciego','Fachada','Desconocido','Lo sabe el otro →','Lo sé yo ↑'],'Divide lo que sabes de ti y lo que otros saben en cuatro zonas. Ampliar la «arena» mejora la comunicación y el autoconocimiento.','Para pedir feedback y revelar lo que ocultas: reduces puntos ciegos y fachada.'],
['ses','Sesgo de confirmación','cyc',['Creencia','Buscas|pruebas afines','Ignoras lo|contrario','Creencia|reforzada'],'Tendemos a buscar y recordar información que confirma lo que ya pensamos y a descartar la que lo contradice.','Busca activamente argumentos contrarios y pide a alguien que defienda la postura opuesta.'],
['ses','Falacia del coste hundido','flo',['Ya invertí|mucho','Sigo para|no perderlo','Pierdo|más','Reevalúa|y corta'],'Continuar con algo por lo ya gastado, aunque el futuro no lo justifique. Lo pasado no se recupera decidas lo que decidas.','Pregúntate: «Si empezara hoy desde cero, ¿elegiría esto?».'],
['ses','Efecto Dunning-Kruger','cur',['Conocimiento','Confianza','dk'],'Quien sabe poco sobrestima su capacidad; la confianza cae al descubrir cuánto falta y se recupera con la experiencia real.','Sé prudente al empezar y busca opiniones de expertos antes de decidir.'],
['ses','Aversión a la pérdida','bar',['Ganar|100 €','Perder|100 €'],'Perder duele aproximadamente el doble de lo que alegra ganar lo mismo, lo que nos vuelve demasiado conservadores.','Replantea decisiones en términos de resultado final, no de lo que «pierdes».',[100,200]],
['ind','Pirámide de Maslow','pyr',['Fisiológicas','Seguridad','Pertenencia','Estima','Autorrealización'],'Las necesidades humanas se ordenan en niveles: al cubrir las básicas, aparecen las superiores como motivación.','Para entender qué motiva a alguien (o a ti) en cada etapa.'],
['ind','Ikigai','ven',['Lo que amas','El mundo|lo necesita','Te pagan|por ello','Se te da|bien','Ikigai'],'Concepto japonés de «razón de ser»: la intersección entre pasión, vocación, profesión y misión.','Para orientar carrera o proyectos: busca el solapamiento de las cuatro.'],
['ind','Matriz de Eisenhower','mat',['Decidir|(planificar)','Hacer ya','Eliminar','Delegar','Urgente →','Importante ↑'],'Clasifica tareas por urgencia e importancia. Lo importante y no urgente es donde se construye el futuro.','Al planificar la semana: haz, programa, delega o elimina cada tarea.'],
['ind','Maestría','cur',['Práctica','Nivel','mast'],'El progreso real avanza con mesetas: periodos largos sin mejora aparente seguidos de saltos. Quien persiste en la meseta domina la habilidad.','Cuando sientas estancamiento: es normal; mantén la práctica deliberada.'],
['eq','Roles de equipo de Belbin','ven',['Acción','Sociales','Mentales','Equipo'],'Un equipo sano combina nueve roles agrupados en tres familias: acción, relaciones y pensamiento. Nadie los cubre todos.','Para formar equipos y detectar qué rol falta, no qué persona.'],
['eq','Modelo DISC','mat',['Dominancia','Influencia','Cumplimiento','Estabilidad','← tareas · personas →','Activo ↑ Reservado'],'Describe estilos de comportamiento: dominante, influyente, estable y concienzudo (cumplimiento).','Para adaptar tu comunicación al estilo de cada persona.'],
['eq','Etapas de Tuckman','flo',['Formación','Conflicto','Normas','Rendimiento'],'Los equipos atraviesan fases: conocerse, chocar, acordar normas y por fin rendir. Saltarse una suele pasar factura.','Si un equipo nuevo tiene fricción: probablemente está en la fase de conflicto.'],
['org','Por qué, Cómo, Qué','con',['QUÉ','CÓMO','POR QUÉ'],'Las organizaciones inspiradoras comunican de dentro hacia fuera: empiezan por el propósito (por qué), luego el método y por último el producto.','Para definir una misión, un discurso o una marca.'],
['org','Design Thinking','flo',['Empatizar','Definir','Idear','Prototipar','Testear'],'Enfoque centrado en las personas: entiendes el problema real, generas ideas, construyes prototipos baratos y los pruebas.','Para innovar con usuarios reales antes de invertir en construir.'],
['org','Lienzo de modelo de negocio','mat',['Propuesta|de valor','Clientes','Recursos|y costes','Ingresos','Mercado →','Interno ↑'],'Resume un negocio en nueve bloques. Aquí se simplifica en cuatro ejes: valor, clientes, recursos y dinero.','Para esbozar o revisar un negocio en una sola página.'],
['org','OKR','pyr',['Tareas|diarias','Resultados|clave (KR)','Objetivo (O)'],'Un objetivo ambicioso se mide con 2-5 resultados clave concretos, que a su vez guían el trabajo diario.','Para alinear a un equipo: pocos objetivos, medibles y revisados cada trimestre.'],
['soc','Pensamiento sistémico','cyc',['Acción','Resultado','Reacción','Ajuste'],'Los problemas surgen de bucles de retroalimentación, no de causas lineales. Entender la estructura permite actuar en sus palancas.','Si un problema reaparece una y otra vez: busca el bucle que lo alimenta.'],
['soc','Economía de la rosquilla','con',['Techo|ecológico','Espacio justo|y seguro','Base social'],'Una economía sana opera entre un mínimo social para todas las personas y un techo ecológico que el planeta puede soportar.','Para evaluar políticas o empresas con criterios sociales y ambientales.'],
['soc','Conocidos y desconocidos','mat',['Sé que sé','Sé que|no sé','No sé|que sé','No sé|que no sé','Conciencia →','Conocimiento ↑'],'Distingue lo que sabes, lo que sabes que ignoras y lo que ni siquiera sabes que ignoras (los riesgos más peligrosos).','En proyectos inciertos: explora los «desconocidos desconocidos» con expertos.'],
['dec','Bucle OODA','cyc',['Observar','Orientar','Decidir','Actuar'],'Ciclo de decisión rápida de John Boyd. Quien recorre el bucle más deprisa que el entorno mantiene la iniciativa.','En situaciones cambiantes: competencia, crisis, productos nuevos.'],
['dec','Pre-mortem','flo',['Imagina que|fracasó','Lista las|causas','Prevé|medidas','Ejecuta'],'Antes de empezar, supones que el proyecto ha fracasado y explicas por qué. Revela riesgos que el optimismo oculta.','Al lanzar un plan importante, con todo el equipo.'],
['dec','Navaja de Ockham','bar',['A: 5|supuestos','B: 3|supuestos','C: 1|supuesto'],'Entre explicaciones equivalentes, la que requiere menos supuestos suele ser la más probable.','Al diagnosticar fallos o evaluar teorías.',[30,60,95]],
['dec','Impacto vs. esfuerzo','mat',['Rellenos','Victorias|rápidas','Evitar','Proyectos|grandes','Impacto →','Menos esfuerzo ↑'],'Ordena iniciativas por el valor que aportan y lo que cuestan. Las victorias rápidas se hacen primero.','Para priorizar un backlog o una lista de ideas.'],
['dec','Primeros principios','flo',['Problema','Descompón en|verdades básicas','Cuestiona|supuestos','Reconstruye'],'Reducir un problema a sus hechos fundamentales y reconstruir la solución desde ahí, en lugar de razonar por analogía.','Cuando «siempre se ha hecho así» limita tus opciones.']
];
const NS='http://www.w3.org/2000/svg';
const T=(x,y,s,z=9,a='middle',r)=>{const L=String(s).split('|');return `<text x="${x}" y="${y-(L.length-1)*z*.55}" font-size="${z}" text-anchor="${a}" fill="var(--tx)"${r?` transform="rotate(${r} ${x} ${y})"`:''}>`+L.map((l,i)=>`<tspan x="${x}" dy="${i?z*1.1:0}">${l}</tspan>`).join('')+'</text>'};
const W=(b,c)=>`<svg viewBox="0 0 300 180" role="img"><defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8z" fill="${c}"/></marker></defs>${b}</svg>`;
const F=(c,o=.18)=>`fill="${c}" fill-opacity="${o}" stroke="${c}" stroke-width="1.5"`;
const G={
pyr(l,c){const n=l.length,h=160/n;return l.map((s,i)=>{const yb=170-i*h,yt=yb-h,w=y=>(y-10)/160*120;return `<polygon points="${150-w(yt)},${yt} ${150+w(yt)},${yt} ${150+w(yb)},${yb} ${150-w(yb)},${yb}" ${F(c,.1+.15*i/n+.1)}/>`+T(150,yt+h/2+3,s,Math.min(9,n>4?8:9))}).join('')},
mat(l,c){const a=[[50,10],[155,10],[50,90],[155,90]];return a.map((p,i)=>`<rect x="${p[0]}" y="${p[1]}" width="100" height="76" rx="4" ${F(c,i==1?.35:.14)}/>`+T(p[0]+50,p[1]+40,l[i],10)).join('')+T(155,176,l[4]||'',9)+T(22,90,l[5]||'',9,'middle',-90)},
cur(l,c){const P={exp:'M20 160Q170 150 280 14',dim:'M20 160C50 50 120 28 280 22',dk:'M20 160C40 25 70 15 90 40C110 120 130 150 170 130C220 100 250 60 280 48',mast:'M20 160L60 112L95 114L130 70L165 72L200 32L235 34L282 18'}[l[2]];return `<path d="M30 10V160H285" fill="none" stroke="var(--mu)"/><path d="${P}" fill="none" stroke="${c}" stroke-width="3"/>`+T(160,176,l[0],10)+T(14,90,l[1],10,'middle',-90)},
cyc(l,c){const n=l.length,p=l.map((s,i)=>{const t=i/n*6.283-1.571;return[150+95*Math.cos(t),90+58*Math.sin(t)]});return p.map((a,i)=>{const b=p[(i+1)%n];return `<line x1="${a[0]+(b[0]-a[0])*.38}" y1="${a[1]+(b[1]-a[1])*.38}" x2="${a[0]+(b[0]-a[0])*.62}" y2="${a[1]+(b[1]-a[1])*.62}" stroke="${c}" stroke-width="2" marker-end="url(#a)"/>`}).join('')+p.map((a,i)=>`<rect x="${a[0]-42}" y="${a[1]-16}" width="84" height="32" rx="6" ${F(c)}/>`+T(a[0],a[1]+3,l[i],9)).join('')},
ven(l,c){const f=l.length>4,C=f?[[125,70],[175,70],[125,110],[175,110]]:[[130,68],[170,68],[150,100]],r=f?48:46,n=f?4:3,A=f?[[8,22,'start'],[292,22,'end'],[8,172,'start'],[292,172,'end']]:[[40,22,'middle'],[260,22,'middle'],[150,176,'middle']];return C.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="${r}" ${F(c,.14)}/>`).join('')+A.map((a,i)=>T(a[0],a[1],l[i],9,a[2])).join('')+T(150,f?93:84,l[n],10)},
flo(l,c){const n=l.length,k=n>4?3:n,rows=Math.ceil(n/k),w=Math.min(78,(280-(k-1)*18)/k);return l.map((s,i)=>{const r=Math.floor(i/k),q=i%k,cnt=Math.min(k,n-r*k),x=150-(cnt*w+(cnt-1)*18)/2+q*(w+18),y=rows>1?32+r*70:73;return `<rect x="${x}" y="${y}" width="${w}" height="38" rx="6" ${F(c)}/>`+T(x+w/2,y+22,s,9)+(i<n-1?(q<cnt-1?`<line x1="${x+w+2}" y1="${y+19}" x2="${x+w+16}" y2="${y+19}" stroke="${c}" stroke-width="2" marker-end="url(#a)"/>`:`<path d="M${x+w/2} ${y+40}V${y+54}H${150-(Math.min(k,n-(r+1)*k)*w+(Math.min(k,n-(r+1)*k)-1)*18)/2+w/2}V${y+68}" fill="none" stroke="${c}" stroke-width="2" marker-end="url(#a)"/>`):'')}).join('')},
bar(l,c,v){const n=l.length,w=Math.min(46,240/n-8);return `<path d="M30 10V150H285" fill="none" stroke="var(--mu)"/>`+l.map((s,i)=>{const h=v[i]/Math.max(...v)*130,x=40+i*(245/n)+(245/n-w)/2;return `<rect x="${x}" y="${150-h}" width="${w}" height="${h}" ${F(c,.3)}/>`+T(x+w/2,164,s,8)}).join('')},
con(l,c){return l.map((s,i)=>{const r=80-i*(60/l.length*1.1);return `<circle cx="150" cy="92" r="${r}" ${F(c,.1+i*.12)}/>`+T(150,92-r+13,s,9)}).join('')}};
const svg=m=>W(G[m[2]](m[3].slice(),C[m[0]][1],m[6]),C[m[0]][1]);
const bar=document.getElementById('bar'),grid=document.getElementById('grid'),dlg=document.getElementById('dlg'),dc=document.getElementById('dc');
let cat='',q='',cur=0,list=[];
function render(){list=M.map((m,i)=>i).filter(i=>(!cat||M[i][0]==cat)&&(M[i][1]+M[i][4]).toLowerCase().includes(q));
grid.innerHTML=list.map(i=>{const m=M[i];return `<button class="card" style="--c:${C[m[0]][1]}" onclick="open_(${i})">${svg(m)}<h3>${m[1]}</h3><small>${C[m[0]][0]}</small></button>`}).join('')||'<p>Sin resultados. Prueba con otra palabra.</p>'}
function open_(i){cur=i;const m=M[i],c=C[m[0]][1];dc.innerHTML=`<div style="--c:${c}"><span class="tag" style="color:${c}">${C[m[0]][0]}</span><h2>${m[1]}</h2>${svg(m)}<div class="box"><b>Qué es.</b> ${m[4]}</div><div class="box"><b>Cuándo usarlo.</b> ${m[5]}</div></div>`;if(!dlg.open)dlg.showModal()}
function step(d){const k=list.indexOf(cur);if(k>-1)open_(list[(k+d+list.length)%list.length])}
const mk=(k,t)=>{const b=document.createElement('button');b.className='chip';b.textContent=t;b.setAttribute('aria-pressed',k==cat);if(k)b.style.setProperty('--c',C[k][1]);b.onclick=()=>{cat=k;[...bar.querySelectorAll('.chip')].forEach(x=>x.setAttribute('aria-pressed',x===b));render()};bar.append(b)};
mk('','Todos');Object.keys(C).forEach(k=>mk(k,C[k][0]));
const s=document.createElement('input');s.placeholder='Buscar modelo…';s.setAttribute('aria-label','Buscar modelo');s.oninput=()=>{q=s.value.toLowerCase();render()};bar.append(s);
render();
</script>
<script>
document.body.insertAdjacentHTML('afterbegin','<svg style="position:absolute;width:0;height:0" aria-hidden="true"><filter id="rough"><feTurbulence type="fractalNoise" baseFrequency=".035" numOctaves="2" seed="4"/><feDisplacementMap in="SourceGraphic" scale="3.5"/></filter></svg>');
document.querySelector('h1').insertAdjacentHTML('beforeend','<svg class="sc" viewBox="0 0 300 12" preserveAspectRatio="none"><path pathLength="1" d="M2 8Q40 1 80 7T160 6T298 4"/></svg>');
C.com=['Liderazgo y comunicación','#d6336c'];C.gest=['Proyectos y metas','#4d8a1f'];
M.push(
['ind','Big Five (personalidad)','bar',['Apertura','Cons-|ciencia','Extra-|versión','Ama-|bilidad','Neuro-|ticismo'],'Cinco rasgos que describen la personalidad: apertura, responsabilidad, extraversión, amabilidad y estabilidad emocional. Cada persona tiene un nivel en cada uno.','Para conocerte mejor y entender por qué otros reaccionan distinto a ti.',[75,60,50,70,35]],
